    <script>
        function searchImages() {
            const query = document.getElementById('query').value;
            const gallery = document.getElementById('gallery');
            if(!query) return alert("Scrivi qualcosa!");
            
            gallery.innerHTML = "<p>Caricamento immagini di prova...</p>";
            
            setTimeout(() => {
                gallery.innerHTML = "";
                // Genera 6 immagini finte basate sulla parola cercata
                for(let i=1; i<=6; i++) {
                    const card = document.createElement('div');
                    card.className = 'card';
                    const imgUrl = `https://picsum.photos{i}`;
                    card.innerHTML = `
                        <img src="${imgUrl}">
                        <a href="${imgUrl}" target="_blank" class="download-btn">⬇️ Scarica</a>
                    `;
                    gallery.appendChild(card);
                }
            }, 500);
        }
    </script>
