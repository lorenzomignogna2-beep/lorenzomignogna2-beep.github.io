<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cerca Immagini Gratis</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: #f0f2f5; padding: 20px; margin: 0; }
        
        /* Stile per l'avviso dell'AdBlock e delle autorizzazioni */
        .alert-banner {
            background-color: #fff3cd;
            color: #856404;
            border: 1px solid #ffeeba;
            padding: 12px;
            margin: 10px auto 25px auto;
            max-width: 600px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            line-height: 1.4;
        }

        .box { margin: 20px auto; max-width: 400px; display: flex; gap: 10px; }
        input { flex: 1; padding: 12px; font-size: 16px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 12px 24px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background: #0056b3; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; max-width: 1200px; margin: 20px auto; }
        .card { background: white; padding: 10px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .card img { width: 100%; height: 200px; object-fit: cover; border-radius: 4px; }
        .btn { display: block; margin-top: 10px; padding: 10px; background: #28a745; color: white; text-decoration: none; border-radius: 4px; font-weight: bold; }
        .btn:hover { background: #218838; }
    </style>
</head>
<body>

    <!-- Banner di Avviso in alto sulla pagina -->
    <div class="alert-banner">
        ⚠️ NOTA: Se riscontri problemi nel caricamento o nel download delle immagini, <br>
        disattiva l'AdBlock per questo sito e concedi al browser l'autorizzazione a scaricare i file.
    </div>

    <h1>🔍 Cerca Immagini Gratis</h1>
    <p>Scrivi un argomento qualsiasi (es: natura, auto, spazio) e premi Cerca.</p>

    <div class="box">
        <input type="text" id="parola" placeholder="Cosa stai cercando?">
        <button onclick="trovaFoto()">Cerca</button>
    </div>

    <div class="grid" id="risultati"></div>

    <script>
        function trovaFoto() {
            const parola = document.getElementById('parola').value;
            const risultati = document.getElementById('risultati');
            if(!parola) return alert("Scrivi qualcosa!");
            
            risultati.innerHTML = "<p>Caricamento immagini...</p>";
            risultati.innerHTML = "";
            
            for(let i = 1; i <= 6; i++) {
                const card = document.createElement('div');
                card.className = 'card';
                
                // Link pulito e privo di variabili complesse per garantire la massima stabilità
                const urlImmagine = "https://unsplash.com";

                card.innerHTML = `
                    <img src="${urlImmagine}" alt="Foto">
                    <a href="${urlImmagine}" target="_blank" class="btn">⬇️ Scarica Foto</a>
                `;
                risultati.appendChild(card);
            }
        }
    </script>

</body>
</html>
