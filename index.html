<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cerca Immagini Gratis</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f7f6;
            color: #333;
            text-align: center;
        }
        h1 { color: #2c3e50; }
        .search-box {
            margin: 20px auto;
            max-width: 500px;
            display: flex;
            gap: 10px;
        }
        input {
            flex: 1;
            padding: 12px;
            font-size: 16px;
            border: 2px solid #bdc3c7;
            border-radius: 8px;
            outline: none;
        }
        input:focus { border-color: #3498db; }
        button {
            padding: 12px 24px;
            font-size: 16px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background-color: #2980b9; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 30px auto;
        }
        .card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.2s;
        }
        .card:hover { transform: translateY(-5px); }
        .card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }
        .download-btn {
            display: block;
            padding: 10px;
            background-color: #2ecc71;
            color: white;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
        }
        .download-btn:hover { background-color: #27ae60; }
    </style>
</head>
<body>

    <h1>🔍 Cerca Immagini Gratis</h1>
    <p>Inserisci un argomento (meglio in inglese) per trovare e scaricare foto libere da copyright.</p>

    <div class="search-box">
        <input type="text" id="query" placeholder="Es: space, nature, cars...">
        <button onclick="searchImages()">Cerca</button>
    </div>

    <div class="grid" id="gallery"></div>

    <script>
        // Questa è una chiave dimostrativa pubblica fornita da Unsplash per i test.
        // Se smette di funzionare, dovrai crearne una tua gratis su Unsplash Developers.
        const apiKey = "v_SgZ90_wU-5kZ_Y2P-34H33486K79717-m9L2D5780"; 

        async function searchImages() {
            const query = document.getElementById('query').value;
            const gallery = document.getElementById('gallery');
            if(!query) return alert("Scrivi qualcosa prima di cercare!");
            
            gallery.innerHTML = "<p>Ricerca in corso...</p>";
            
            try {
                // Colleghiamo il sito al database di Unsplash
                const response = await fetch(`https://unsplash.com{query}&client_id=8ee37a04a37f0007bda7db29e612f01f8d423910c2ba52427a19ff2128795908&per_page=12`);
                const data = await response.json();
                
                gallery.innerHTML = "";
                
                if(data.results.length === 0) {
                    gallery.innerHTML = "<p>Nessuna immagine trovata. Prova un altro termine (es. in inglese).</p>";
                    return;
                }

                data.results.forEach(photo => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    
                    // Forza il download diretto aggiungendo il parametro dl=true richiesto da Unsplash
                    const downloadUrl = photo.links.download + "&dl=true";

                    card.innerHTML = `
                        <img src="${photo.urls.small}" alt="${photo.alt_description}">
                        <a href="${downloadUrl}" target="_blank" class="download-btn">⬇️ Scarica Gratis</a>
                    `;
                    gallery.appendChild(card);
                });
            } catch (error) {
                gallery.innerHTML = "<p>Errore nel caricamento delle immagini. Riprova più tardi.</p>";
                console.error(error);
            }
        }

        // Permette di premere "Invio" sulla tastiera per cercare
        document.getElementById('query').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') searchImages();
        });
    </script>

</body>
</html>
