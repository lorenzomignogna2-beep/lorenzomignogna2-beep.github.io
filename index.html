<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galleria Immagini Gratis</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: #f0f2f5; padding: 20px; margin: 0; }
        .alert-banner { background-color: #fff3cd; color: #856404; border: 1px solid #ffeeba; padding: 12px; margin: 10px auto; max-width: 600px; border-radius: 6px; font-size: 14px; font-weight: bold; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; max-width: 1200px; margin: 30px auto; }
        .card { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .card img { width: 100%; height: 200px; object-fit: cover; border-radius: 4px; }
        .btn { display: block; margin-top: 10px; padding: 10px; background: #28a745; color: white; text-decoration: none; border-radius: 4px; font-weight: bold; }
        .btn:hover { background: #218838; }
    </style>
</head>
<body>

    <div class="alert-banner">
        ⚠️ NOTA: Se riscontri problemi nel download, disattiva l'AdBlock per questo sito.
    </div>

    <h1>📸 Galleria Immagini Gratis da Scaricare</h1>
    <p>Ecco una selezione di foto ad alta risoluzione pronte al download libero.</p>

    <div class="grid">
        <!-- Foto 1: Natura e Paesaggi -->
        <div class="card">
            <img src="https://unsplash.com" alt="Natura">
            <a href="https://unsplash.com" target="_blank" download="natura.jpg" class="btn">⬇️ Scarica Foto</a>
        </div>
        <!-- Foto 2: Spazio Cosmico -->
        <div class="card">
            <img src="https://unsplash.com" alt="Spazio">
            <a href="https://unsplash.com" target="_blank" download="spazio.jpg" class="btn">⬇️ Scarica Foto</a>
        </div>
        <!-- Foto 3: Auto Sportiva -->
        <div class="card">
            <img src="https://unsplash.com" alt="Auto">
            <a href="https://unsplash.com" target="_blank" download="auto.jpg" class="btn">⬇️ Scarica Foto</a>
        </div>
        <!-- Foto 4: Città di Notte -->
        <div class="card">
            <img src="https://unsplash.com" alt="Città">
            <a href="https://unsplash.com" target="_blank" download="citta.jpg" class="btn">⬇️ Scarica Foto</a>
        </div>
        <!-- Foto 5: Mare Tropicale -->
        <div class="card">
            <img src="https://unsplash.com" alt="Mare">
            <a href="https://unsplash.com" target="_blank" download="mare.jpg" class="btn">⬇️ Scarica Foto</a>
        </div>
        <!-- Foto 6: Montagne -->
        <div class="card">
            <img src="https://unsplash.com" alt="Montagna">
            <a href="https://unsplash.com" target="_blank" download="montagna.jpg" class="btn">⬇️ Scarica Foto</a>
        </div>
    </div>

</body>
</html>
